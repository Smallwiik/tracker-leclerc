name: Tracker E.Leclerc

on:
  schedule:
    - cron: "*/10 * * * *"     # toutes les 10 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:            # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write               # pour sauvegarder l'état (leclerc_etat.json) dans le dépôt

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Vérifier les produits
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python leclerc_tracker.py --once

      - name: Sauvegarder l'état
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add leclerc_etat.json
          git diff --cached --quiet || git commit -m "maj état"
          git push
